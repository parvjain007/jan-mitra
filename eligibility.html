    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eligibility Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 400px;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        /* Empty results area */
        #results {
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <div class="container">

        <form id="eligibilityForm">

            <h2>Eligibility Form</h2>

            <!-- Age -->
            <label for="age">Age:</label>
            <input
                type="number"
                id="age"
                name="age"
                placeholder="Enter your age"
                required
            >

            <!-- State Dropdown -->
            <label for="state">State:</label>
            <select id="state" name="state" required>
                <option value="">Select State</option>
                <option value="Rajasthan">Rajasthan</option>
                <option value="Delhi">Delhi</option>
                <option value="Gujarat">Gujarat</option>
                <option value="Haryana">Haryana</option>
                <option value="Punjab">Punjab</option>
            </select>

            <!-- City - Manual Entry -->
            <label for="city">City:</label>
            <input
                type="text"
                id="city"
                name="city"
                placeholder="Enter your city"
                required
            >

            <!-- Annual Income -->
            <label for="income">Annual Income:</label>
            <input
                type="number"
                id="income"
                name="income"
                placeholder="Enter annual income"
                required
            >

            <!-- Occupation Dropdown -->
            <label for="occupation">Occupation:</label>
            <select id="occupation" name="occupation" required>
                <option value="">Select Occupation</option>
                <option value="Student">Student</option>
                <option value="Farmer">Farmer</option>
                <option value="Business Owner">Business Owner</option>
                <option value="Other">Other</option>
            </select>

            <!-- Category Dropdown -->
            <label for="category">Category:</label>
            <select id="category" name="category" required>
                <option value="">Select Category</option>
                <option value="General">General</option>
                <option value="OBC">OBC</option>
                <option value="SC">SC</option>
                <option value="ST">ST</option>
                <option value="EWS">EWS</option>
            </select>

            <!-- Submit Button -->
            <button type="submit">
                Check Eligibility
            </button>

        </form>

        <!-- Results will appear here later -->
        <div id="results"></div>

    </div>
    <script>
const form = document.getElementById("eligibilityForm");
form.addEventListener("submit", function(event) {
    event.preventDefault();
    const ageValue = document.getElementById("age").value;
const stateValue = document.getElementById("state").value;
const cityvalue = document.getElementById("city").value;
const incomevalue = document.getElementById("income").value;
const occupationvalue = document.getElementById("occupation").value;
const categoryvalue= document.getElementById("category").value;
const formData = {
    age: ageValue,
    state: stateValue,
    city:cityvalue,
    income:incomevalue,
    occupation:occupationvalue,
    category:categoryvalue,
    

};
console.log(formData);
fetch("http://localhost:5000/api/check-eligibility", {  
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(formData)
})
.then(response => response.json())
.then(function(result) {
    const resultsDiv = document.getElementById("results");
    resultsDiv.innerHTML = "";

    if (result.matches.length === 0) {
        resultsDiv.innerHTML = "<p>No matching schemes found.</p>";
    } else {
        result.matches.forEach(function(scheme) {
            resultsDiv.innerHTML += `
                <div style="border:1px solid #ccc; padding:10px; margin-top:10px; border-radius:5px;">
                    <h3>${scheme.name}</h3>
                    <p>${scheme.benefit}</p>
                </div>
            `;
        });
    }
});
});

</script>

</body>
</html>
