<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login & Sign Up — JanMitra AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root {
  --primary: #2563EB;
  --primary-dark: #1D4ED8;
  --primary-light: #60A5FA;
  --secondary: #10B981;
  --accent: #F59E0B;
  --danger: #EF4444;
  --bg: #F8FAFC;
  --card: #FFFFFF;
  --text: #0F172A;
  --text-muted: #475569;
  --text-soft: #94A3B8;
  --border: #E2E8F0;
  --shadow-md: 0 10px 30px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 24px 60px rgba(15, 23, 42, 0.12);
  --radius: 20px;
  --radius-sm: 12px;
  --font-display: 'Plus Jakarta Sans', 'Inter', sans-serif;
  --font-body: 'Inter', sans-serif;
}
[data-theme="dark"] {
  --bg: #0B1120;
  --card: #111A2E;
  --text: #F1F5F9;
  --text-muted: #94A3B8;
  --text-soft: #5B6B84;
  --border: #1E293B;
  --shadow-md: 0 10px 30px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.55);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  transition: background .3s ease, color .3s ease;
  position: relative;
  overflow-x: hidden;
}
.bg-mesh {
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(600px 450px at 10% 15%, rgba(37,99,235,0.12), transparent 70%),
    radial-gradient(600px 500px at 90% 85%, rgba(16,185,129,0.10), transparent 70%),
    radial-gradient(500px 400px at 50% 50%, rgba(245,158,11,0.06), transparent 70%);
}
/* Navbar Minimal */
.login-nav {
  padding: 20px 32px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  max-width: 1200px;
  width: 100%;
  margin: 0 auto;
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 19px;
  text-decoration: none;
  color: var(--text);
}
.logo-mark {
  width: 36px;
  height: 36px;
  border-radius: 11px;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 16px;
  box-shadow: 0 6px 16px rgba(37,99,235,0.35);
}
.nav-right {
  display: flex;
  align-items: center;
  gap: 14px;
}
.theme-toggle {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--card);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  cursor: pointer;
  transition: all .2s;
}
.theme-toggle:hover {
  color: var(--primary);
  border-color: var(--primary-light);
}
.back-home {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-muted);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: color .2s;
}
.back-home:hover { color: var(--primary); }

/* Main Wrapper */
.auth-wrapper {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 20px 48px;
}
.auth-card {
  width: 100%;
  max-width: 480px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  padding: 38px 36px;
  position: relative;
  transition: transform .3s ease;
}
@media (max-width: 480px) {
  .auth-card { padding: 28px 20px; }
}
.auth-header {
  text-align: center;
  margin-bottom: 26px;
}
.auth-header h1 {
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 800;
  margin-bottom: 6px;
  letter-spacing: -0.02em;
}
.auth-header p {
  color: var(--text-muted);
  font-size: 14px;
}

/* Tabs */
.auth-tabs {
  display: flex;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 4px;
  margin-bottom: 24px;
}
.tab-btn {
  flex: 1;
  padding: 10px 16px;
  border: none;
  background: none;
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 600;
  color: var(--text-muted);
  border-radius: 9px;
  cursor: pointer;
  transition: all .2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.tab-btn.active {
  background: var(--card);
  color: var(--primary);
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}

/* Alert Boxes */
.alert {
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  font-size: 13.5px;
  margin-bottom: 20px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  line-height: 1.4;
}
.alert-danger {
  background: rgba(239, 68, 68, 0.1);
  color: #DC2626;
  border: 1px solid rgba(239, 68, 68, 0.25);
}
.alert-success {
  background: rgba(16, 185, 129, 0.1);
  color: #059669;
  border: 1px solid rgba(16, 185, 129, 0.25);
}
.alert-info {
  background: rgba(37, 99, 235, 0.1);
  color: var(--primary);
  border: 1px solid rgba(37, 99, 235, 0.25);
}

/* Form Fields */
.form-group {
  margin-bottom: 18px;
}
.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 7px;
  color: var(--text);
}
.input-wrap {
  position: relative;
  display: flex;
  align-items: center;
}
.input-icon {
  position: absolute;
  left: 14px;
  color: var(--text-soft);
  font-size: 15px;
  pointer-events: none;
  transition: color .2s;
}
.input-field {
  width: 100%;
  padding: 12px 14px 12px 42px;
  font-size: 14.5px;
  font-family: inherit;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  transition: all .2s ease;
}
.input-field:focus {
  outline: none;
  border-color: var(--primary);
  background: var(--card);
  box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
}
.input-field:focus + .input-icon,
.input-field:focus ~ .input-icon {
  color: var(--primary);
}
.password-toggle {
  position: absolute;
  right: 14px;
  background: none;
  border: none;
  color: var(--text-soft);
  cursor: pointer;
  font-size: 14px;
  padding: 4px;
  transition: color .2s;
}
.password-toggle:hover { color: var(--text); }

/* Password Strength Meter */
.strength-meter {
  margin-top: 6px;
  display: none;
}
.strength-bars {
  display: flex;
  gap: 4px;
  height: 4px;
  margin-bottom: 4px;
}
.strength-bar {
  flex: 1;
  border-radius: 2px;
  background: var(--border);
  transition: background .3s ease;
}
.strength-text {
  font-size: 11.5px;
  color: var(--text-soft);
}

/* Options Row */
.form-options {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  margin-bottom: 22px;
}
.remember-me {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text-muted);
  cursor: pointer;
}
.remember-me input {
  accent-color: var(--primary);
  cursor: pointer;
}
.forgot-link {
  color: var(--primary);
  text-decoration: none;
  font-weight: 600;
  transition: text-decoration .2s;
}
.forgot-link:hover { text-decoration: underline; }

/* Buttons */
.btn-submit {
  width: 100%;
  padding: 13px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 6px 20px rgba(37,99,235,0.3);
  transition: all .2s ease;
}
.btn-submit:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 24px rgba(37,99,235,0.4);
}
.btn-submit:active { transform: translateY(0); }

/* Divider */
.divider {
  display: flex;
  align-items: center;
  margin: 22px 0;
  color: var(--text-soft);
  font-size: 12.5px;
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}
.divider span { padding: 0 12px; }

/* Demo Quick Fill Button */
.demo-pill {
  width: 100%;
  background: color-mix(in srgb, var(--primary) 8%, var(--card));
  border: 1px dashed var(--primary-light);
  border-radius: var(--radius-sm);
  padding: 11px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  margin-bottom: 18px;
  transition: all .2s;
}
.demo-pill:hover {
  background: color-mix(in srgb, var(--primary) 14%, var(--card));
  border-color: var(--primary);
}
.demo-pill div { text-align: left; }
.demo-pill strong { font-size: 13px; display: block; color: var(--primary); }
.demo-pill span { font-size: 11.5px; color: var(--text-muted); }
.demo-pill i { color: var(--primary); font-size: 14px; }

/* Social Buttons */
.social-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.btn-social {
  padding: 10px 14px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  transition: all .2s ease;
}
.btn-social:hover {
  background: var(--card);
  border-color: var(--primary-light);
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}
.digilocker-badge {
  color: #1E3A8A;
  font-weight: 800;
  letter-spacing: -0.5px;
}

/* Footer note */
.auth-footer {
  text-align: center;
  margin-top: 22px;
  font-size: 13px;
  color: var(--text-muted);
}
.auth-footer a {
  color: var(--primary);
  font-weight: 600;
  text-decoration: none;
}
.auth-footer a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="bg-mesh"></div>

<!-- Minimal Navigation -->
<nav class="login-nav">
  <a href="/" class="logo">
    <span class="logo-mark"><i class="fa-solid fa-sparkles"></i></span>
    JanMitra AI
  </a>
  <div class="nav-right">
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle Theme">
      <i class="fa-solid fa-moon"></i>
    </button>
    <a href="/" class="back-home"><i class="fa-solid fa-arrow-left"></i> Home</a>
  </div>
</nav>

<!-- Auth Container -->
<div class="auth-wrapper">
  <div class="auth-card">

    <div class="auth-header">
      <h1 id="formHeading">Welcome to JanMitra</h1>
      <p id="formSubheading">Access your personalized schemes, applications & benefits</p>
    </div>

    <!-- Mode Selector Tabs -->
    <div class="auth-tabs">
      <button class="tab-btn active" id="tabLogin" onclick="switchAuthTab('login')">
        <i class="fa-solid fa-right-to-bracket"></i> Citizen Login
      </button>
      <button class="tab-btn" id="tabRegister" onclick="switchAuthTab('register')">
        <i class="fa-solid fa-user-plus"></i> New Registration
      </button>
    </div>

    <!-- Alert Box for Server & Validation Messages -->
    <div id="authAlert" class="alert alert-danger" style="display:none;">
      <i class="fa-solid fa-circle-exclamation"></i>
      <span id="alertMessage"></span>
    </div>

    <!-- Quick Demo Access Pill (Login tab only) -->
    <div class="demo-pill" id="demoPill" onclick="fillDemoCredentials()" title="Click to autofill sample credentials">
      <div>
        <strong><i class="fa-solid fa-bolt"></i> Quick Demo Access</strong>
        <span>demo@janmitra.gov.in / Password@123</span>
      </div>
      <i class="fa-solid fa-arrow-right"></i>
    </div>

    <!-- LOGIN FORM -->
    <form id="loginForm" onsubmit="handleLogin(event)" action="/login" method="POST">
      <div class="form-group">
        <label for="loginEmail">Email Address</label>
        <div class="input-wrap">
          <input type="email" id="loginEmail" name="email" class="input-field" placeholder="citizen@example.com" required autocomplete="email">
          <i class="fa-solid fa-envelope input-icon"></i>
        </div>
      </div>

      <div class="form-group">
        <label for="loginPassword">Password</label>
        <div class="input-wrap">
          <input type="password" id="loginPassword" name="password" class="input-field" placeholder="Enter your password" required autocomplete="current-password">
          <i class="fa-solid fa-lock input-icon"></i>
          <button type="button" class="password-toggle" onclick="togglePasswordVisibility('loginPassword', this)">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" name="remember" id="rememberMe" checked>
          <span>Remember me</span>
        </label>
        <a href="javascript:void(0)" onclick="handleForgotPassword()" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="btn-submit" id="loginSubmitBtn">
        <span>Log In to JanMitra</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>

    <!-- REGISTRATION FORM -->
    <form id="registerForm" onsubmit="handleRegister(event)" action="/register" method="POST" style="display:none;">
      <div class="form-group">
        <label for="regName">Full Name</label>
        <div class="input-wrap">
          <input type="text" id="regName" name="name" class="input-field" placeholder="Full name as per Aadhaar" required autocomplete="name">
          <i class="fa-solid fa-user input-icon"></i>
        </div>
      </div>

      <div class="form-group">
        <label for="regEmail">Email Address</label>
        <div class="input-wrap">
          <input type="email" id="regEmail" name="email" class="input-field" placeholder="citizen@example.com" required autocomplete="email">
          <i class="fa-solid fa-envelope input-icon"></i>
        </div>
      </div>

      <div class="form-group">
        <label for="regPassword">Create Password</label>
        <div class="input-wrap">
          <input type="password" id="regPassword" name="password" class="input-field" placeholder="Minimum 6 characters" required oninput="evaluatePasswordStrength(this.value)">
          <i class="fa-solid fa-lock input-icon"></i>
          <button type="button" class="password-toggle" onclick="togglePasswordVisibility('regPassword', this)">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
        <div class="strength-meter" id="strengthMeter">
          <div class="strength-bars">
            <div class="strength-bar" id="strBar1"></div>
            <div class="strength-bar" id="strBar2"></div>
            <div class="strength-bar" id="strBar3"></div>
          </div>
          <span class="strength-text" id="strengthText">Password strength</span>
        </div>
      </div>

      <div class="form-group">
        <label for="regConfirmPassword">Confirm Password</label>
        <div class="input-wrap">
          <input type="password" id="regConfirmPassword" name="confirm_password" class="input-field" placeholder="Re-enter password" required>
          <i class="fa-solid fa-shield-check input-icon"></i>
          <button type="button" class="password-toggle" onclick="togglePasswordVisibility('regConfirmPassword', this)">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
      </div>

      <div class="form-options">
        <label class="remember-me" style="font-size:12px;">
          <input type="checkbox" id="regAgree" required checked>
          <span>I agree to Citizen Privacy Policy & Terms</span>
        </label>
      </div>

      <button type="submit" class="btn-submit" id="regSubmitBtn">
        <span>Create Citizen Account</span>
        <i class="fa-solid fa-user-check"></i>
      </button>
    </form>

    <!-- Social / Official Logins -->
    <div class="divider">
      <span>or continue with</span>
    </div>

    <div class="social-buttons">
      <button type="button" class="btn-social" onclick="simulateOAuth('DigiLocker')">
        <span class="digilocker-badge"><i class="fa-solid fa-shield-halved"></i> DigiLocker</span>
      </button>
      <button type="button" class="btn-social" onclick="simulateOAuth('Google')">
        <i class="fa-brands fa-google" style="color:#EA4335;"></i> Google
      </button>
    </div>

    <div class="auth-footer">
      <span id="footerPrompt">Need assistance finding benefits?</span>
      <a href="/check-eligibility" style="margin-left:4px;">Check Eligibility without login</a>
    </div>

  </div>
</div>

<script>
// Theme Management
const themeToggle = document.getElementById('themeToggle');
const html = document.documentElement;

const savedTheme = localStorage.getItem('janmitra_theme') || 'light';
html.setAttribute('data-theme', savedTheme);
updateThemeIcon(savedTheme);

themeToggle.addEventListener('click', () => {
  const current = html.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('janmitra_theme', next);
  updateThemeIcon(next);
});

function updateThemeIcon(theme) {
  themeToggle.innerHTML = theme === 'dark' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
}

// Tab Switching
function switchAuthTab(mode) {
  const isLogin = mode === 'login';
  document.getElementById('tabLogin').classList.toggle('active', isLogin);
  document.getElementById('tabRegister').classList.toggle('active', !isLogin);

  document.getElementById('loginForm').style.display = isLogin ? 'block' : 'none';
  document.getElementById('registerForm').style.display = isLogin ? 'none' : 'block';
  document.getElementById('demoPill').style.display = isLogin ? 'flex' : 'none';

  document.getElementById('formHeading').textContent = isLogin ? 'Welcome to JanMitra' : 'Create Citizen Account';
  document.getElementById('formSubheading').textContent = isLogin 
    ? 'Access your personalized schemes, applications & benefits' 
    : 'Join over 50,000+ citizens discovering their government welfare benefits';

  hideAlert();
}

// Toggle password visibility
function togglePasswordVisibility(inputId, btn) {
  const input = document.getElementById(inputId);
  const isPassword = input.type === 'password';
  input.type = isPassword ? 'text' : 'password';
  btn.innerHTML = isPassword ? '<i class="fa-regular fa-eye-slash"></i>' : '<i class="fa-regular fa-eye"></i>';
}

// Fill Demo Credentials
function fillDemoCredentials() {
  document.getElementById('loginEmail').value = 'demo@janmitra.gov.in';
  document.getElementById('loginPassword').value = 'Password@123';
  showAlert('Demo credentials filled! Click Log In or press Enter to continue.', 'info');
}

// Password Strength
function evaluatePasswordStrength(pwd) {
  const meter = document.getElementById('strengthMeter');
  if (!pwd) {
    meter.style.display = 'none';
    return;
  }
  meter.style.display = 'block';
  const b1 = document.getElementById('strBar1');
  const b2 = document.getElementById('strBar2');
  const b3 = document.getElementById('strBar3');
  const txt = document.getElementById('strengthText');

  let score = 0;
  if (pwd.length >= 6) score++;
  if (/[A-Z]/.test(pwd) && /[0-9]/.test(pwd)) score++;
  if (/[^A-Za-z0-9]/.test(pwd) && pwd.length >= 8) score++;

  b1.style.background = '#E2E8F0';
  b2.style.background = '#E2E8F0';
  b3.style.background = '#E2E8F0';

  if (score === 1) {
    b1.style.background = '#EF4444';
    txt.textContent = 'Weak password (try adding letters & numbers)';
    txt.style.color = '#EF4444';
  } else if (score === 2) {
    b1.style.background = '#F59E0B';
    b2.style.background = '#F59E0B';
    txt.textContent = 'Medium password (add a special character e.g. @, #)';
    txt.style.color = '#F59E0B';
  } else {
    b1.style.background = '#10B981';
    b2.style.background = '#10B981';
    b3.style.background = '#10B981';
    txt.textContent = 'Strong password';
    txt.style.color = '#10B981';
  }
}

// Alerts
function showAlert(msg, type = 'danger') {
  const alert = document.getElementById('authAlert');
  const text = document.getElementById('alertMessage');
  alert.className = `alert alert-${type}`;
  alert.style.display = 'flex';
  const icon = type === 'success' ? 'fa-circle-check' : (type === 'info' ? 'fa-circle-info' : 'fa-circle-exclamation');
  alert.querySelector('i').className = `fa-solid ${icon}`;
  text.textContent = msg;
}
function hideAlert() {
  document.getElementById('authAlert').style.display = 'none';
}

// Handle Login Submission
async function handleLogin(e) {
  e.preventDefault();
  hideAlert();
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const remember = document.getElementById('rememberMe').checked;

  if (!email || !password) {
    showAlert('Please fill in both your email and password.');
    return;
  }

  const btn = document.getElementById('loginSubmitBtn');
  const originalHTML = btn.innerHTML;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';
  btn.disabled = true;

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password, remember })
    });
    const data = await res.json();
    if (res.ok && data.success) {
      showAlert('Login successful! Redirecting...', 'success');
      setTimeout(() => {
        const nextUrl = new URLSearchParams(window.location.search).get('next') || '/dashboard';
        window.location.href = nextUrl;
      }, 700);
    } else {
      showAlert(data.message || 'Invalid email or password.');
      btn.innerHTML = originalHTML;
      btn.disabled = false;
    }
  } catch (err) {
    showAlert('Unable to connect to authentication server. Falling back to direct submit...');
    document.getElementById('loginForm').submit();
  }
}

// Handle Register Submission
async function handleRegister(e) {
  e.preventDefault();
  hideAlert();
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPassword').value;
  const confirmPassword = document.getElementById('regConfirmPassword').value;

  if (!name || !email || !password) {
    showAlert('Please fill in all required fields.');
    return;
  }
  if (password.length < 6) {
    showAlert('Password must be at least 6 characters long.');
    return;
  }
  if (password !== confirmPassword) {
    showAlert('Passwords do not match. Please re-enter.');
    return;
  }

  const btn = document.getElementById('regSubmitBtn');
  const originalHTML = btn.innerHTML;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating account...';
  btn.disabled = true;

  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password, confirm_password: confirmPassword })
    });
    const data = await res.json();
    if (res.ok && data.success) {
      showAlert('Account created successfully! Welcome to JanMitra.', 'success');
      setTimeout(() => {
        window.location.href = '/dashboard';
      }, 900);
    } else {
      showAlert(data.message || 'Registration failed. Please try again.');
      btn.innerHTML = originalHTML;
      btn.disabled = false;
    }
  } catch (err) {
    showAlert('Unable to reach server. Falling back to direct submit...');
    document.getElementById('registerForm').submit();
  }
}

function handleForgotPassword() {
  const email = prompt('Enter your registered email address to receive password reset instructions:', document.getElementById('loginEmail').value);
  if (email) {
    showAlert(`Password reset instructions have been sent to ${email} (Demo mode).`, 'info');
  }
}

function simulateOAuth(provider) {
  showAlert(`Connecting with ${provider}... In this demo environment, please use citizen login or quick demo access above.`, 'info');
}

// Check URL query parameters (e.g. ?mode=register or ?error=...)
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('mode') === 'register') {
  switchAuthTab('register');
}
if (urlParams.get('error')) {
  showAlert(decodeURIComponent(urlParams.get('error')));
}
